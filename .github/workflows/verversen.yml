name: Nieuws verversen

on:
  schedule:
    - cron: "*/20 4-22 * * *"   # elke 20 minuten, ca. 05:00–00:00 Nederlandse tijd
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: verversen
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install -r requirements.txt

      - name: Cache met foto's en vorige berichten terugzetten
        uses: actions/cache@v4
        with:
          path: .cache
          key: nvdd-cache-${{ github.run_id }}
          restore-keys: nvdd-cache-

      - name: Bronnen ophalen
        run: python scripts/build_data.py public .cache

      - name: Pages-project aanmaken (alleen de eerste keer)
        continue-on-error: true
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages project create nieuws-van-de-dag --production-branch=main

      - name: Publiceren op Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy public --project-name=nieuws-van-de-dag --branch=main --commit-dirty=true
